[package]
name = "toka"
version = "0.0.0"
edition = "2021"
authors = ["Nick Spiker <fractaldecoder@proton.me>"]
description = "Capability-bounded stack VM for secure distributed computing"
repository = "https://github.com/nickspiker/toka"
license = "MIT OR Apache-2.0"
keywords = ["vm", "capability", "spirix", "vsf", "bytecode"]
categories = ["no-std", "wasm", "cryptography"]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "toka"
path = "src/main.rs"

[dependencies]
# Core dependencies for deterministic computation
spirix = { path = "../spirix" }
fontdue = { package = "fontdue-spirix", path = "../fontdue-spirix", default-features = false, optional = true }
blake3 = "1"
vsf = { path = "../vsf", default-features = false, features = ["spirix", "crypto", "inspect", "handle"] }
bytemuck = "1.14"

# getrandom with WASM support - Both 0.2 (js) and 0.3 (wasm_js) are used by dependencies
# We need to explicitly enable WASM features for both versions
[dependencies.getrandom-02]
package = "getrandom"
version = "0.2"
features = ["js"]

[dependencies.getrandom-03]
package = "getrandom"
version = "0.3"
features = ["wasm_js"]

# fluor renders headless here (paint + text + canvas — no host, no icon/rav1d). rayon only off-wasm:
# wasm32-unknown-unknown has no threads, and fluor's row loops fall back to sequential without it.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
fluor = { path = "../fluor", optional = true, default-features = false, features = ["std", "text", "simd", "rayon"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
fluor = { path = "../fluor", optional = true, default-features = false, features = ["std", "text", "simd"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["CanvasRenderingContext2d", "HtmlCanvasElement", "ImageData", "console"] }
console_error_panic_hook = { version = "0.1", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "rect"
harness = false

[features]
default = ["console_error_panic_hook", "runtime"]
console_error_panic_hook = ["dep:console_error_panic_hook"]
# `runtime` is the rendering path (fluor canvas + fonts); image decode rides along here so a
# capsule can blit an avatar/icon. Gating it under `runtime` keeps it OUT of the fgtw-bootstrap
# worker build, which takes toka with `default-features = false` and must stay tiny.
runtime = ["dep:fontdue", "dep:fluor", "vsf/image-decode"]

# rav1d (AV1 decoder, pulled by vsf/image-decode) can't build for wasm32-unknown-unknown off the
# shelf — the OS-less target lacks a few libc type aliases it imports. The vendored fork renames
# its `libc` dep to `vendor/libc-shim`, which re-exports libc plus those ~11 defs on wasm. This
# patch only applies when toka is the build root (browser build); the worker build ignores it.
[patch.crates-io]
rav1d = { path = "vendor/rav1d" }
